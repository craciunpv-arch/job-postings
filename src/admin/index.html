<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
  <link href="/api/cms-config" type="text/yaml" rel="cms-config-url" />
</head>
<body>
  <div style="background:#0d0f17;color:#fff;padding:10px 16px;font-family:system-ui,sans-serif;font-size:14px;display:flex;align-items:center;justify-content:space-between;">
    <span>Content Manager</span>
    <span style="display:flex;gap:20px;">
      <a href="/admin/stats/" style="color:#fff;text-decoration:underline;">View Stats →</a>
      <a href="https://vercel.com/craciunpv-archs-projects/job-postings/analytics" target="_blank" rel="noopener" style="color:#fff;text-decoration:underline;">View Analytics →</a>
    </span>
  </div>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    var TeamPreview = createClass({
      render: function () {
        var entry = this.props.entry;
        var name = entry.getIn(['data', 'name']) || '';
        var zoom = entry.getIn(['data', 'photoZoom']);
        var posX = entry.getIn(['data', 'photoPositionX']);
        var posY = entry.getIn(['data', 'photoPositionY']);
        zoom = (zoom === undefined || zoom === null || zoom === '') ? 100 : zoom;
        posX = (posX === undefined || posX === null || posX === '') ? 50 : posX;
        posY = (posY === undefined || posY === null || posY === '') ? 50 : posY;
        var photoPath = entry.getIn(['data', 'photo']);
        var asset = photoPath ? this.props.getAsset(photoPath) : null;
        var photoUrl = asset ? asset.toString() : null;

        return h('div', { style: { padding: '32px', fontFamily: 'sans-serif' } },
          h('div', {
            style: {
              width: '160px',
              height: '160px',
              borderRadius: '50%',
              overflow: 'hidden',
              background: '#e3d6c4',
              border: '1px solid #e3d6c4',
            }
          },
            photoUrl ? h('img', {
              src: photoUrl,
              style: {
                width: zoom + '%',
                height: zoom + '%',
                objectFit: 'cover',
                marginLeft: (-1 * (zoom - 100) * (posX / 100)) + '%',
                marginTop: (-1 * (zoom - 100) * (posY / 100)) + '%',
              }
            }) : null
          ),
          h('p', { style: { marginTop: '14px', fontWeight: 'bold', fontSize: '16px', color: '#2b2420' } }, name),
          h('p', { style: { fontSize: '13px', color: '#837567', maxWidth: '260px' } }, 'This is how their avatar will look on job cards and job pages. Adjust Photo Zoom/Position above until their face is centered here.')
        );
      }
    });

    CMS.registerPreviewTemplate('team', TeamPreview);

    // Show each job's public URL, with a copy button, and its client teaser under its title in the Job Postings list.
    var jobInfo = {};
    fetch('/admin/jobs.json').then(function (r) { return r.json(); }).then(function (data) {
      jobInfo = data;
      document.querySelectorAll('.job-public-link').forEach(function (row) { row.remove(); });
      addJobLinks();
    }).catch(function () {});

    function addJobLinks() {
      document.querySelectorAll('a[href*="/collections/jobs/entries/"]').forEach(function (card) {
        var slug = card.getAttribute('href').split('/entries/')[1].split('?')[0];
        var next = card.nextElementSibling;
        if (!slug || (next && next.className === 'job-public-link')) return;
        var url = location.origin + '/' + slug + '/';

        var row = document.createElement('div');
        row.className = 'job-public-link';
        row.style.cssText = 'display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 20px 12px;margin-top:-6px;font-size:13px;';

        var link = document.createElement('a');
        link.href = url;
        link.target = '_blank';
        link.rel = 'noopener';
        link.textContent = url.replace(/^https?:\/\//, '') + ' ↗';
        link.style.cssText = 'color:#3266ff;text-decoration:underline;';

        var copy = document.createElement('button');
        copy.type = 'button';
        copy.textContent = 'Copy';
        copy.style.cssText = 'font:inherit;font-size:12px;color:#26282a;background:#fff;border:1px solid #dcdfe1;border-radius:6px;padding:1px 9px;cursor:pointer;';
        copy.addEventListener('click', function () {
          navigator.clipboard.writeText(url).then(function () {
            copy.textContent = 'Copied ✓';
            setTimeout(function () { copy.textContent = 'Copy'; }, 2000);
          });
        });

        row.appendChild(link);
        row.appendChild(copy);
        var info = jobInfo[slug] || {};
        if (info.unlisted) {
          var hidden = document.createElement('span');
          hidden.textContent = 'Hidden from homepage';
          hidden.style.cssText = 'font-size:12px;color:#523bbf;background:rgba(107,78,230,0.14);border-radius:999px;padding:1px 9px;';
          row.appendChild(hidden);
        }
        if (info.teaser) {
          var teaser = document.createElement('span');
          teaser.textContent = info.teaser;
          teaser.style.cssText = 'flex-basis:100%;color:#565b5e;';
          row.appendChild(teaser);
        }
        card.insertAdjacentElement('afterend', row);
      });
    }
    // In the job editor, show the selected client's teaser and description under the Client dropdown.
    var clientList = [];
    fetch('/admin/clients.json').then(function (r) { return r.json(); }).then(function (data) {
      clientList = data;
      showClientInfo();
    }).catch(function () {});

    function showClientInfo() {
      var label = document.querySelector('label[for^="client-field"]');
      if (!label) return;
      var field = label.closest('[class*="ControlContainer"]') || label.parentElement.parentElement;
      var selected = field.querySelector('[class*="singleValue"]');
      var teaser = selected ? selected.textContent.trim() : '';
      var box = field.querySelector('.client-info');
      if (box && box.dataset.teaser === teaser) return;
      if (!box) {
        box = document.createElement('div');
        box.className = 'client-info';
        box.style.cssText = 'margin-top:10px;padding:12px 14px;border:1px solid #dcdfe1;border-radius:6px;background:#f7f8f9;font-size:13px;line-height:1.5;color:#26282a;';
        field.appendChild(box);
      }
      box.dataset.teaser = teaser;
      box.textContent = '';
      box.hidden = !teaser;
      if (!teaser) return;
      var client = clientList.filter(function (c) { return c.teaser === teaser; })[0];
      var line = function (title, text) {
        var heading = document.createElement('div');
        heading.textContent = title;
        heading.style.cssText = 'font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#83888b;margin-top:8px;';
        var body = document.createElement('div');
        body.textContent = text;
        body.style.cssText = 'white-space:pre-wrap;';
        box.appendChild(heading);
        box.appendChild(body);
      };
      line('Teaser shown on this role', teaser);
      box.firstChild.style.marginTop = '0';
      if (client) {
        line('Description shown on this role', client.description);
        var edit = document.createElement('a');
        edit.href = '#/collections/clients/entries/' + client.slug;
        edit.textContent = 'Edit this client →';
        edit.style.cssText = 'display:inline-block;margin-top:10px;color:#3266ff;text-decoration:underline;';
        box.appendChild(edit);
      } else {
        line('Description', 'This client was added or renamed recently. Its description appears here once the site has rebuilt, about a minute after publishing.');
      }
    }

    new MutationObserver(function () { addJobLinks(); showClientInfo(); }).observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
