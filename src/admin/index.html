<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
  <link href="/api/cms-config" type="text/yaml" rel="cms-config-url" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/admin/admin-bar.css" />
  <link rel="stylesheet" href="/admin/cms.css" />
</head>
<body>
  <header class="admin-bar">
    <a class="admin-brand" href="/admin/"><img src="/favicon.svg" alt="" /><span>Hand Picked Jobs</span><em>Admin</em></a>
    <nav class="admin-nav" aria-label="Admin">
      <a href="/admin/" aria-current="page">Content Manager</a>
      <a href="/admin/stats/">View Stats</a>
      <a href="/" target="_blank" rel="noopener">View Site <span class="ext" aria-hidden="true">↗</span></a>
      <a href="https://vercel.com/craciunpv-archs-projects/job-postings/analytics" target="_blank" rel="noopener">View Analytics <span class="ext" aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    var TeamPreview = createClass({
      render: function () {
        var entry = this.props.entry;
        var name = entry.getIn(['data', 'name']) || '';
        var zoom = entry.getIn(['data', 'photoZoom']);
        var posX = entry.getIn(['data', 'photoPositionX']);
        var posY = entry.getIn(['data', 'photoPositionY']);
        zoom = (zoom === undefined || zoom === null || zoom === '') ? 100 : zoom;
        posX = (posX === undefined || posX === null || posX === '') ? 50 : posX;
        posY = (posY === undefined || posY === null || posY === '') ? 50 : posY;
        var photoPath = entry.getIn(['data', 'photo']);
        var asset = photoPath ? this.props.getAsset(photoPath) : null;
        var photoUrl = asset ? asset.toString() : null;

        return h('div', { style: { padding: '32px', fontFamily: 'sans-serif' } },
          h('div', {
            style: {
              width: '160px',
              height: '160px',
              borderRadius: '50%',
              overflow: 'hidden',
              background: '#e3d6c4',
              border: '1px solid #e3d6c4',
            }
          },
            photoUrl ? h('img', {
              src: photoUrl,
              style: {
                width: zoom + '%',
                height: zoom + '%',
                objectFit: 'cover',
                marginLeft: (-1 * (zoom - 100) * (posX / 100)) + '%',
                marginTop: (-1 * (zoom - 100) * (posY / 100)) + '%',
              }
            }) : null
          ),
          h('p', { style: { marginTop: '14px', fontWeight: 'bold', fontSize: '16px', color: '#2b2420' } }, name),
          h('p', { style: { fontSize: '13px', color: '#837567', maxWidth: '260px' } }, 'This is how their avatar will look on job cards and job pages. Adjust Photo Zoom/Position above until their face is centered here.')
        );
      }
    });

    CMS.registerPreviewTemplate('team', TeamPreview);
    // The preview pane is an iframe without the site's CSS; give it readable type.
    CMS.registerPreviewStyle(
      'body{margin:0;padding:28px 32px;font-family:"Gill Sans MT Pro","Gill Sans MT","Gill Sans",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.6;color:#26282a;background:#fff;max-width:760px}' +
      'h1,h2,h3{line-height:1.25;letter-spacing:-0.015em;color:#1d1d1f}h1{font-size:30px;margin:0 0 16px}' +
      'ul{padding-left:20px}li{margin:4px 0}a{color:#2f56c2}strong{color:#1d1d1f}' +
      'img{max-width:100%;height:auto;border-radius:12px}hr{border:0;border-top:1px solid #e3e6e8;margin:20px 0}',
      { raw: true }
    );

    // "Unpublish" on a job would delete its file from the site. Instead, mark the role as Filled:
    // it leaves the homepage list, its page stays live with a Filled badge, and it stays in the CMS.
    var JOBS_REPO = 'craciunpv-arch/job-postings';
    var JOBS_BRANCH = 'main';

    function markJobFilled(slug) {
      var user = {};
      try { user = JSON.parse(localStorage.getItem('decap-cms-user') || localStorage.getItem('netlify-cms-user') || '{}'); } catch (e) {}
      if (!user.token) return Promise.reject(new Error('You are not logged in to GitHub in this tab. Reload the page and log in again.'));
      var url = 'https://api.github.com/repos/' + JOBS_REPO + '/contents/src/jobs/' + encodeURIComponent(slug) + '.md';
      var headers = { Authorization: 'token ' + user.token, Accept: 'application/vnd.github+json' };
      var check = function (r) {
        if (r.ok) return r.json();
        return r.json().catch(function () { return {}; }).then(function (body) {
          throw new Error('GitHub answered ' + r.status + (body.message ? ': ' + body.message : ''));
        });
      };
      return fetch(url + '?ref=' + JOBS_BRANCH, { headers: headers, cache: 'no-store' }).then(check).then(function (file) {
        var bytes = Uint8Array.from(atob(file.content.replace(/\s/g, '')), function (c) { return c.charCodeAt(0); });
        var text = new TextDecoder().decode(bytes);
        if (!/^visibility: .*$/m.test(text)) throw new Error('This job has no Visibility field to update.');
        var updated = text.replace(/^visibility: .*$/m, 'visibility: Filled');
        var binary = '';
        new TextEncoder().encode(updated).forEach(function (b) { binary += String.fromCharCode(b); });
        return fetch(url, {
          method: 'PUT',
          headers: headers,
          body: JSON.stringify({ message: 'Mark Job Postings “' + slug + '” as filled', content: btoa(binary), sha: file.sha, branch: JOBS_BRANCH })
        }).then(check);
      });
    }

    function interceptUnpublish(event) {
      if (event.type === 'keydown' && event.key !== 'Enter' && event.key !== ' ') return;
      var item = event.target.closest && event.target.closest('[role="menuitem"]');
      var match = location.hash.match(/\/collections\/jobs\/entries\/([^/?]+)/);
      if (!item || !match || item.textContent.trim() !== 'Unpublish') return;
      event.preventDefault();
      event.stopImmediatePropagation();
      if (!confirm('Mark this role as Filled?\n\nIt leaves the homepage list. Its page stays live with a "Filled" badge, and the role stays here in the CMS.')) return;
      markJobFilled(decodeURIComponent(match[1])).then(function () {
        alert('Done. The role is now Filled. The site updates in about a minute.');
        location.reload();
      }).catch(function (error) {
        alert('The role was NOT changed and nothing was deleted.\n\n' + error.message);
      });
    }
    document.addEventListener('click', interceptUnpublish, true);
    document.addEventListener('keydown', interceptUnpublish, true);

    // The CMS only publishes entries whose workflow status is Ready. Choosing a Publish option on a
    // Draft or In review entry sets it to Ready first, then publishes, so it takes one click.
    var PUBLISH_ITEMS = ['Publish now', 'Publish and create new', 'Publish and duplicate'];
    var publishing = false;

    function toolbarButton(test) {
      return Array.prototype.filter.call(document.querySelectorAll('[role="button"]'), function (b) {
        return test(b.textContent.trim());
      })[0];
    }
    function menuItem(label) {
      return Array.prototype.filter.call(document.querySelectorAll('[role="menuitem"]'), function (i) {
        return i.textContent.trim() === label;
      })[0];
    }
    function waitFor(find, ms) {
      return new Promise(function (resolve, reject) {
        var started = Date.now();
        (function poll() {
          var found = find();
          if (found) return resolve(found);
          if (Date.now() - started > ms) return reject(new Error('timeout'));
          setTimeout(poll, 100);
        })();
      });
    }
    function isStatus(text) { return text.indexOf('Status:') === 0; }

    function publishInOneClick(event) {
      if (publishing) return;
      if (event.type === 'keydown' && event.key !== 'Enter' && event.key !== ' ') return;
      var item = event.target.closest && event.target.closest('[role="menuitem"]');
      var label = item ? item.textContent.trim() : '';
      var status = toolbarButton(isStatus);
      if (PUBLISH_ITEMS.indexOf(label) === -1 || !status || status.textContent.trim() === 'Status: Ready') return;
      event.preventDefault();
      event.stopImmediatePropagation();
      publishing = true;
      document.body.click();
      status.click();
      waitFor(function () { return menuItem('Ready'); }, 3000)
        .then(function (ready) {
          ready.click();
          return waitFor(function () { return toolbarButton(function (t) { return t === 'Status: Ready'; }); }, 20000);
        })
        .then(function () {
          toolbarButton(function (t) { return t === 'Publish'; }).click();
          return waitFor(function () { return menuItem(label); }, 3000);
        })
        .then(function (again) { again.click(); })
        // If the CMS refused the status change it has already said why, e.g. unsaved changes.
        .catch(function () {})
        .then(function () { publishing = false; });
    }
    document.addEventListener('click', publishInOneClick, true);
    document.addEventListener('keydown', publishInOneClick, true);

    // Show each job's public URL, with a copy button, and its client teaser under its title in the Job Postings list.
    var jobInfo = {};
    var clientList = [];
    var people = { team: {}, reviews: {} };

    // The job and client data files are for logged-in contributors only, so they are loaded once
    // the CMS login exists: the login is exchanged for a session, then both files are fetched.
    var adminData = { loaded: false, loading: false, retryAt: 0 };
    function loadAdminData() {
      if (adminData.loaded || adminData.loading || Date.now() < adminData.retryAt) return;
      var user = {};
      try { user = JSON.parse(localStorage.getItem('decap-cms-user') || localStorage.getItem('netlify-cms-user') || '{}'); } catch (e) {}
      adminData.loading = true;
      var json = function (r) { if (!r.ok) throw new Error(r.status); return r.json(); };
      var session = !user.token ? Promise.resolve() : fetch('/api/admin-session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: user.token })
      }).catch(function () {});
      session.then(function () {
        return Promise.all([fetch('/admin/jobs.json').then(json), fetch('/admin/clients.json').then(json), fetch('/admin/people.json').then(json)]);
      }).then(function (data) {
        jobInfo = data[0];
        clientList = data[1];
        people = data[2];
        adminData.loaded = true;
        document.querySelectorAll('.job-public-link').forEach(function (row) { row.remove(); });
        addJobLinks();
        showClientInfo();
        addPersonCards();
      }).catch(function () {
        adminData.retryAt = Date.now() + 15000;
      }).then(function () { adminData.loading = false; });
    }

    function addJobLinks() {
      document.querySelectorAll('a[href*="/collections/jobs/entries/"]:not(.job-edit)').forEach(function (card) {
        var slug = card.getAttribute('href').split('/entries/')[1].split('?')[0];
        if (!slug) return;
        var info = jobInfo[slug] || {};
        // "Hidden from homepage" sits next to the role title. Checked on every pass, since Decap
        // can redraw the title on its own.
        var heading = card.querySelector('h2');
        if (info.unlisted && heading && !heading.querySelector('.pill-hidden')) {
          var hidden = document.createElement('span');
          hidden.className = 'pill-hidden';
          hidden.textContent = 'Hidden from homepage';
          heading.appendChild(hidden);
        }
        var next = card.nextElementSibling;
        if (next && next.className === 'job-public-link') return;
        var url = location.origin + '/' + slug + '/';

        var row = document.createElement('div');
        row.className = 'job-public-link';

        // An explicit Edit button, so the live page link below the title isn't mistaken for it.
        var edit = document.createElement('a');
        edit.className = 'job-edit';
        edit.href = card.getAttribute('href');
        edit.textContent = '✎ Edit';

        var label = document.createElement('span');
        label.className = 'live-label';
        label.textContent = 'Live page:';

        var link = document.createElement('a');
        link.href = url;
        link.target = '_blank';
        link.rel = 'noopener';
        link.title = 'Opens the public job page in a new tab';
        link.textContent = url.replace(/^https?:\/\//, '') + ' ↗';

        var copy = document.createElement('button');
        copy.type = 'button';
        copy.textContent = 'Copy';
        copy.addEventListener('click', function () {
          navigator.clipboard.writeText(url).then(function () {
            copy.textContent = 'Copied ✓';
            setTimeout(function () { copy.textContent = 'Copy'; }, 2000);
          });
        });

        var live = document.createElement('span');
        live.className = 'live-group';
        live.appendChild(label);
        live.appendChild(link);
        row.appendChild(edit);
        row.appendChild(live);
        row.appendChild(copy);
        if (info.teaser) {
          var teaser = document.createElement('span');
          teaser.textContent = info.teaser;
          teaser.className = 'teaser';
          row.appendChild(teaser);
        }
        // The role's recruiter, in the card's top-right corner.
        var person = (people.team || {})[info.recruiter];
        if (person) {
          var rec = document.createElement('span');
          rec.className = 'job-recruiter';
          rec.title = 'Recruiter: ' + person.name + (person.role ? ', ' + person.role : '');
          var frame = document.createElement('span');
          frame.className = 'person-photo';
          if (person.photo) {
            var img = document.createElement('img');
            var extra = person.zoom - 100;
            img.src = person.photo;
            img.alt = '';
            img.style.cssText = 'width:' + person.zoom + '%;height:' + person.zoom + '%;margin-left:' + (-extra * person.x / 100) + '%;margin-top:' + (-extra * person.y / 100) + '%;';
            frame.appendChild(img);
          }
          var who = document.createElement('span');
          who.className = 'person-info';
          var name = document.createElement('b');
          name.textContent = person.name;
          who.appendChild(name);
          if (person.role) {
            var role = document.createElement('small');
            role.textContent = person.role;
            who.appendChild(role);
          }
          rec.appendChild(frame);
          rec.appendChild(who);
          var li = card.closest('li');
          if (li && !li.querySelector('.job-recruiter')) {
            li.appendChild(rec);
            li.classList.add('has-recruiter');
          }
        }
        card.insertAdjacentElement('afterend', row);
      });
    }
    // In the job editor, show the selected client's teaser and description under the Client dropdown.

    function showClientInfo() {
      var label = document.querySelector('label[for^="client-field"]');
      if (!label) return;
      var field = label.closest('[class*="ControlContainer"]') || label.parentElement.parentElement;
      var selected = field.querySelector('[class*="singleValue"]');
      var teaser = selected ? selected.textContent.trim() : '';
      var box = field.querySelector('.client-info');
      if (box && box.dataset.teaser === teaser) return;
      if (!box) {
        box = document.createElement('div');
        box.className = 'client-info';
        field.appendChild(box);
      }
      box.dataset.teaser = teaser;
      box.textContent = '';
      box.hidden = !teaser;
      if (!teaser) return;
      var client = clientList.filter(function (c) { return c.teaser === teaser; })[0];
      var line = function (title, text) {
        var heading = document.createElement('h4');
        heading.textContent = title;
        var body = document.createElement('div');
        body.textContent = text;
        body.style.cssText = 'white-space:pre-wrap;';
        box.appendChild(heading);
        box.appendChild(body);
      };
      line('Teaser shown on this role', teaser);
      if (client) {
        line('Description shown on this role', client.description);
        var edit = document.createElement('a');
        edit.href = '#/collections/clients/entries/' + client.slug;
        edit.textContent = 'Edit this client →';
        box.appendChild(edit);
      } else {
        line('Description', 'This client was added or renamed recently. Its description appears here once the site has rebuilt, about a minute after publishing.');
      }
    }

    // Team Members and Reviews cards: a round photo with the name, as on the homepage, instead of
    // Decap's large cropped image. Team photos use the same zoom and position as the site.
    function addPersonCards() {
      ['team', 'reviews'].forEach(function (collection) {
        var data = people[collection] || {};
        document.querySelectorAll('a[href*="/collections/' + collection + '/entries/"]').forEach(function (card) {
          var slug = card.getAttribute('href').split('/entries/')[1].split('?')[0];
          var p = data[slug];
          if (!p || card.querySelector('.person')) return;
          var box = document.createElement('div');
          box.className = 'person';

          var frame = document.createElement('span');
          frame.className = 'person-photo';
          if (p.photo) {
            var img = document.createElement('img');
            img.src = p.photo;
            img.alt = '';
            if (collection === 'team') {
              var z = p.zoom, extra = z - 100;
              img.style.cssText = 'width:' + z + '%;height:' + z + '%;margin-left:' + (-extra * p.x / 100) + '%;margin-top:' + (-extra * p.y / 100) + '%;';
            }
            frame.appendChild(img);
          }

          var info = document.createElement('span');
          info.className = 'person-info';
          var name = document.createElement('b');
          name.textContent = p.name;
          var sub = document.createElement('small');
          if (collection === 'team') {
            sub.textContent = p.role;
          } else {
            sub.textContent = p.type + ' · #' + p.order;
            if (p.partner) sub.className = 'partner';
          }
          info.appendChild(name);
          info.appendChild(sub);
          if (collection === 'reviews' && !p.active) {
            var hidden = document.createElement('span');
            hidden.className = 'pill-hidden';
            hidden.textContent = 'Hidden from homepage';
            info.appendChild(hidden);
          }

          box.appendChild(frame);
          box.appendChild(info);
          card.appendChild(box);
          card.closest('li').classList.add('has-person');
        });
      });
    }

    loadAdminData();
    new MutationObserver(function () { loadAdminData(); addJobLinks(); showClientInfo(); addPersonCards(); }).observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
