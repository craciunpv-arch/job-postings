backend:
  name: github
  repo: craciunpv-arch/job-postings
  branch: main
  base_url: https://hand-picked-jobs.edurom.ro
  auth_endpoint: api/auth

local_backend: true

publish_mode: editorial_workflow

media_folder: "src/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: jobs
    label: "Job Postings"
    folder: src/jobs
    create: true
    slug: "{{slug}}"
    description: |-
      ➕ New role? Click "+ Job Postings" to create it from scratch.
      ✅ Role filled? Open it and set Visibility to Filled. It leaves the homepage, and its page stays online with a "Filled" badge.
      ⛔ Never reuse a role. Don't rewrite an existing role, open or filled, into a different one: it breaks the role's link and its visitor stats.
    view_filters:
      - label: "Open, on homepage"
        field: visibility
        pattern: "Open"
      - label: "Open, link only"
        field: visibility
        pattern: "Link only"
      - label: "Filled"
        field: visibility
        pattern: "Filled"
    view_groups:
      - label: "Visibility"
        field: visibility
      - label: "Client"
        field: client
    fields:
      - label: "Role Title"
        name: title
        widget: string
        hint: "Editing an existing entry? Make sure you're updating THIS same role, not repurposing it for a different one — click \"New Job Postings\" for that instead."
      - { label: "Salary — Min", name: salaryMin, widget: number, value_type: int, min: 0, hint: "Whole number, e.g. 16000 for 16.000. For B2B roles, enter the hourly EUR rate, e.g. 45." }
      - { label: "Salary — Max", name: salaryMax, widget: number, value_type: int, min: 0, hint: "Whole number, e.g. 21000 for 21.000. For B2B roles, enter the hourly EUR rate, e.g. 60." }
      - { label: "Currency", name: salaryCurrency, widget: select, options: ["RON Net", "EUR / hour B2B"], default: "RON Net", hint: "RON Net for employees (monthly). EUR / hour B2B for contractors. B2B rates get their own stats, separate from RON." }
      - label: Seniority
        name: seniority
        widget: select
        options: ["Mid", "Senior", "Expert"]
        multiple: true
        required: false
        hint: "Select more than one if the role spans multiple levels, e.g. Mid and Senior."
      - label: City
        name: city
        widget: select
        multiple: true
        min: 1
        options: ["Bucharest", "Cluj", "Iasi", "Timisoara", "Romania"]
        hint: "Pick every city the role is open in. Use Romania for remote roles open anywhere in the country."
      - label: "Working Type"
        name: workingType
        widget: select
        options: ["Remote", "Hybrid", "Onsite"]
      - label: "Role Type"
        name: roleType
        widget: select
        options: ["Data & AI", "Software engineering", "Cloud, DevOps & security", "Enterprise platforms"]
        required: false
        hint: "Groups roles in the stats. Leave blank if none fits."
      - label: Visibility
        name: visibility
        widget: select
        options:
          - { label: "Open, on homepage", value: "Open" }
          - { label: "Open, link only", value: "Link only" }
          - { label: "Filled", value: "Filled" }
        default: "Open"
        hint: "Open, on homepage: listed for everyone. Open, link only: live at its own link and shown as New, but not listed on the homepage, so you can share it one to one. Filled: off the homepage list, its page stays up with a Filled badge."
      - label: "Posted By"
        name: recruiter
        widget: relation
        collection: team
        search_fields: ["name"]
        display_fields: ["name"]
        value_field: "{{slug}}"
        required: false
        hint: "Teammate who's the point of contact for this role. Leave blank to use the default contact in Site Settings."
      - { label: "Publish Date", name: date, widget: datetime }
      - label: "Client"
        name: client
        widget: relation
        collection: clients
        search_fields: ["teaser"]
        display_fields: ["teaser"]
        value_field: "{{slug}}"
        hint: "Pick the client by its teaser. The role shows that client's teaser and description; to change either, edit the client under Clients. For a new client, add it under Clients first."
      - { label: "Tech Stack", name: techStack, widget: list, required: false, hint: "Tags shown on the listing, e.g. Java, React, PostgreSQL" }
      - { label: "Main Responsibilities", name: responsibilities, widget: markdown }
      - { label: "Must-haves", name: mustHaves, widget: markdown }
      - { label: "Nice-to-haves", name: niceToHaves, widget: markdown }
      - { label: "Other Benefits", name: benefits, widget: markdown }
      - { label: "Selection Process", name: selectionProcess, widget: markdown }
      - { label: "Good to Know", name: goodToKnow, widget: markdown }

  - name: clients
    label: "Clients"
    label_singular: "Client"
    folder: src/clients
    create: true
    slug: "{{slug}}"
    identifier_field: teaser
    description: >-
      Each client's teaser and description, shared by every job posting linked to it. Edit an
      entry here to update all of that client's roles at once. This site's files are public:
      never type the client's name, here or in a job posting.
    fields:
      - { label: "Client Teaser", name: teaser, widget: string, hint: "One line shown on the job cards, e.g. 'Series A fintech in Iași'. It is also how you pick this client when posting a role." }
      - { label: "Client Description", name: description, widget: markdown, hint: "Shown under 'About the Client' on every role linked to this client." }

  - name: team
    label: "Team Members"
    folder: src/team
    create: true
    slug: "{{slug}}"
    identifier_field: name
    fields:
      - { label: "Full Name", name: name, widget: string }
      - { label: "Role / Title", name: role, widget: string, required: false, hint: "e.g. Talent Sourcer, Tech Recruiter" }
      - { label: "Photo", name: photo, widget: image }
      - { label: "Photo Zoom (%)", name: photoZoom, widget: number, default: 100, hint: "Use the preview on the right to check. Increase to zoom in closer on their face (100% = no zoom)." }
      - { label: "Photo Position X (%)", name: photoPositionX, widget: number, default: 50, hint: "0 = far left of the photo, 100 = far right, 50 = centered. Adjust until their face is centered horizontally in the preview." }
      - { label: "Photo Position Y (%)", name: photoPositionY, widget: number, default: 50, hint: "0 = top of the photo, 100 = bottom, 50 = centered. Adjust until their face is centered vertically in the preview." }
      - { label: "LinkedIn URL", name: linkedin, widget: string }
      - { label: "Email", name: email, widget: string }

  - name: reviews
    label: "Reviews"
    label_singular: "Review"
    folder: src/reviews
    create: true
    slug: "{{slug}}"
    identifier_field: name
    description: >-
      Reviews shown on the homepage under "Working with our team". Get the person's consent
      before publishing their name and photo. Switch Active off to hide a review and back on
      to show it again; Order sets which comes first.
    summary: "{{order}}. {{name}}"
    sortable_fields: ["order", "name"]
    view_filters:
      - label: "Shown on homepage"
        field: active
        pattern: true
      - label: "Hidden"
        field: active
        pattern: false
    fields:
      - { label: "Name", name: name, widget: string }
      - { label: "Role Title", name: title, widget: string, required: false, hint: "e.g. Head of Engineering. Kept for reference; the homepage shows the name and the type." }
      - label: Type
        name: type
        widget: select
        options:
          - { label: "Candidate", value: "candidate" }
          - { label: "Hiring partner", value: "hiring_partner" }
      - { label: "Quote", name: quote, widget: text, hint: "Keep it to about 160 characters, word for word from LinkedIn. Use … where you cut." }
      - { label: "Photo", name: photo, widget: image, hint: "Square, at least 160 × 160." }
      - { label: "LinkedIn URL", name: linkedin, widget: string, required: false, hint: "Recommendations page of the colleague this review was written for, e.g. https://www.linkedin.com/in/vlad-craciun/details/recommendations/. Adds a LinkedIn link to the review so visitors can read it in full." }
      - { label: "Order", name: order, widget: number, value_type: int, default: 10, hint: "Lower numbers show first." }
      - { label: "Active", name: active, widget: boolean, default: true, hint: "Switch off to hide the review without deleting it." }

  - name: settings
    label: "Site Settings"
    files:
      - file: src/_data/site.json
        name: site
        label: "General Settings"
        fields:
          - { label: "Site Title", name: siteTitle, widget: string, hint: "Shown in the header next to the Edurom logo." }
          - { label: "Homepage Tagline", name: tagline, widget: text, hint: "Short, team-neutral line shown above the job list." }
          - { label: "Default Contact LinkedIn URL", name: linkedin, widget: string, hint: "Used on the homepage and on any job that has no 'Posted By' teammate set." }
          - { label: "Default Contact Email", name: email, widget: string }
          - { label: "Social Preview Image", name: ogImage, widget: image, required: false, hint: "Shown when a job link is shared on LinkedIn/Twitter/etc." }
          - { label: "Contact Note", name: contactNote, widget: text }
          - { label: "Footer Text", name: footerText, widget: string, hint: "Shown at the bottom of every page, e.g. '© An Edurom Recruitment Project'." }
          - { label: "Footer Font Size (px)", name: footerFontSize, widget: number, default: 13 }
          - { label: "Footer Bold", name: footerBold, widget: boolean, default: false }
          - { label: "Footer Italic", name: footerItalic, widget: boolean, default: false }
          - { label: "Footer Sub-text", name: footerSubtext, widget: text, required: false, hint: "A short company description shown below the footer text, in smaller italic type." }
          - label: "Homepage Stats"
            name: homepageStats
            widget: select
            multiple: true
            required: false
            options:
              - { label: "Roles posted and open now", value: "roles" }
              - { label: "Salary range of open roles (RON and B2B)", value: "salary" }
              - { label: "Working model", value: "working" }
            hint: "Stats shown to candidates in the bar under Open Positions. Untick all to hide the bar. The full stats are at /admin/stats/."

      - file: src/_data/cmsFieldLabels.json
        name: cmsFieldLabels
        label: "CMS Field Labels"
        hint: "Renames the field labels shown when editing Job Postings and Team Members. Refresh the CMS after saving to see the new labels."
        fields:
          - { label: "Job: Role Title", name: "jobs.title", widget: string }
          - { label: "Job: Salary — Min", name: "jobs.salaryMin", widget: string }
          - { label: "Job: Salary — Max", name: "jobs.salaryMax", widget: string }
          - { label: "Job: Currency", name: "jobs.salaryCurrency", widget: string }
          - { label: "Job: Seniority", name: "jobs.seniority", widget: string }
          - { label: "Job: City", name: "jobs.city", widget: string }
          - { label: "Job: Working Type", name: "jobs.workingType", widget: string }
          - { label: "Job: Role Type", name: "jobs.roleType", widget: string }
          - { label: "Job: Visibility", name: "jobs.visibility", widget: string }
          - { label: "Job: Posted By", name: "jobs.recruiter", widget: string }
          - { label: "Job: Publish Date", name: "jobs.date", widget: string }
          - { label: "Job: Client", name: "jobs.client", widget: string }
          - { label: "Job: Tech Stack", name: "jobs.techStack", widget: string }
          - { label: "Job: Main Responsibilities", name: "jobs.responsibilities", widget: string }
          - { label: "Job: Must-haves", name: "jobs.mustHaves", widget: string }
          - { label: "Job: Nice-to-haves", name: "jobs.niceToHaves", widget: string }
          - { label: "Job: Other Benefits", name: "jobs.benefits", widget: string }
          - { label: "Job: Selection Process", name: "jobs.selectionProcess", widget: string }
          - { label: "Job: Good to Know", name: "jobs.goodToKnow", widget: string }
          - { label: "Team: Full Name", name: "team.name", widget: string }
          - { label: "Team: Role / Title", name: "team.role", widget: string }
          - { label: "Team: Photo", name: "team.photo", widget: string }
          - { label: "Team: Photo Zoom (%)", name: "team.photoZoom", widget: string }
          - { label: "Team: Photo Position X (%)", name: "team.photoPositionX", widget: string }
          - { label: "Team: Photo Position Y (%)", name: "team.photoPositionY", widget: string }
          - { label: "Team: LinkedIn URL", name: "team.linkedin", widget: string }
          - { label: "Team: Email", name: "team.email", widget: string }
