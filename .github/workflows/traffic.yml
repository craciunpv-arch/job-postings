name: Save traffic stats

# Vercel's free plan keeps one month of analytics, so this saves the numbers daily.
on:
  schedule:
    - cron: "40 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: traffic-stats

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/ingest-traffic.js
        env:
          VERCEL_ANALYTICS_TOKEN: ${{ secrets.VERCEL_ANALYTICS_TOKEN }}
      - name: Commit updated numbers
        run: |
          if git diff --quiet src/_data/traffic.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/_data/traffic.json
          git commit -m "Update traffic stats"
          git pull --rebase
          git push
